name: Nightly Performance Benchmarks

on:
  schedule:
    # Run nightly at 2:00 AM UTC
    - cron: "0 2 * * *"

  workflow_dispatch:

jobs:
  run-benchmarks:
    name: Run Performance Benchmarks
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      - name: Run benchmarks
        run: |
          dotnet run -c Release --project Teqniqly.Results.Benchmarks/Teqniqly.Results.Benchmarks.csproj

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: BenchmarkDotNet.Artifacts/results/
          retention-days: 90

  analyze-performance:
    name: Analyze Performance Results
    runs-on: ubuntu-latest
    needs: run-benchmarks

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download benchmark results
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results
          path: BenchmarkDotNet.Artifacts/results/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compare against baseline
        id: compare
        continue-on-error: false
        run: |
          python .github/scripts/compare-benchmarks.py \
            --baseline performance_reviews/baselines/baseline-current.json \
            --cpu-results BenchmarkDotNet.Artifacts/results/Teqniqly.Results.Benchmarks.ResultCpuBenchmarks-report-github.md \
            --memory-results BenchmarkDotNet.Artifacts/results/Teqniqly.Results.Benchmarks.ResultMemoryBenchmarks-report-github.md \
            --output performance_reviews/nightly/performance-review-$(date +%Y-%m-%d).md \
            --new-baseline performance_reviews/baselines/baseline-new.json

          if [ $? -ne 0 ] && [ $? -ne 1 ]; then
            echo "Error: Comparison script failed with unexpected error"
            exit 1
          fi
      - name: Upload performance review
        uses: actions/upload-artifact@v4
        with:
          name: performance-review
          path: performance_reviews/nightly/performance-review-*.md
          retention-days: 90

      - name: Check for regressions
        id: regression-check
        run: |
          if [ -f .regression-detected ]; then
            echo "has_regression=true" >> $GITHUB_OUTPUT
            echo "severity=$(cat .regression-severity)" >> $GITHUB_OUTPUT
          else
            echo "has_regression=false" >> $GITHUB_OUTPUT
          fi

      - name: Update baseline if no regressions
        if: steps.regression-check.outputs.has_regression == 'false'
        run: |
          # Replace current baseline with new baseline
          mv performance_reviews/baselines/baseline-new.json performance_reviews/baselines/baseline-current.json

          # Commit the updated baseline
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add performance_reviews/baselines/baseline-current.json
          git add performance_reviews/nightly/performance-review-*.md
          git commit -m "chore: update performance baseline - $(date +%Y-%m-%d)"
          git push
      - name: Create issue for regressions
        if: steps.regression-check.outputs.has_regression == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            try {
              const reviewFile = fs.readdirSync('performance_reviews/nightly')
                .find(f => f.startsWith('performance-review-'));
              
              if (!reviewFile) {
                core.setFailed('Performance review file not found');
                return;
              }
              
              const reviewContent = fs.readFileSync(
                `performance_reviews/nightly/${reviewFile}`, 
                'utf8'
              );

              const severity = '${{ steps.regression-check.outputs.severity }}';
              const severityLabel = severity === 'CRITICAL' ? '🔴' : 
                                   severity === 'MAJOR' ? '🟠' : '🟡';

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `${severityLabel} Performance Regression Detected - ${new Date().toISOString().split('T')[0]}`,
                body: reviewContent,
                labels: ['performance-regression', `severity-${severity.toLowerCase()}`]
              });
            } catch (error) {
              core.setFailed(`Failed to create regression issue: ${error.message}`);
            }
      - name: Comment on latest commit
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            try {
              const reviewFile = fs.readdirSync('performance_reviews/nightly')
                .find(f => f.startsWith('performance-review-'));
              
              if (!reviewFile) {
                core.setFailed('Performance review file not found');
                return;
              }
              
              const reviewPath = `performance_reviews/nightly/${reviewFile}`;
              const reviewContent = fs.readFileSync(reviewPath, 'utf8');

              // Extract summary section (first 500 chars after ## Summary)
              const summaryMatch = reviewContent.match(/## Summary[\s\S]{0,500}/);
              const summary = summaryMatch ? summaryMatch[0] : 'Performance review completed.';

              const hasRegression = '${{ steps.regression-check.outputs.has_regression }}';
              const status = hasRegression === 'true' ? '⚠️ Regressions Detected' : '✅ All Benchmarks Passed';

              await github.rest.repos.createCommitComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
                body: `## Nightly Performance Benchmark Results\n\n**Status**: ${status}\n\n${summary}\n\n[View Full Report](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
              });
            } catch (error) {
              core.setFailed(`Failed to create commit comment: ${error.message}`);
            }
